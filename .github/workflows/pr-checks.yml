name: PR checks

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: pr-checks-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run lint

  deno-tests:
    name: deno-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run test:chat
      - run: npm run test:auth-lock
      # Node-based, unlike the Deno suites above. It lives in this job rather
      # than its own so it is covered by the existing required-check name.
      - run: npm run test:linear
