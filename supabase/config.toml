# A string used to distinguish different Supabase projects on the same host.
project_id = "finla"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "exp://localhost:8081"
jwt_expiry = 3600
enable_signup = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# Edge Function env for the local runtime (`supabase start` and `supabase functions serve`).
# env(...) resolves from the root .env, with .env.local overriding it — the Supabase CLI
# loads both. Add every new Deno.env key here. The hosted project uses dashboard secrets.
[edge_runtime.secrets]
AUTH_MASTER_KEY = "env(AUTH_MASTER_KEY)"
AUTH_JWT_SECRET = "env(AUTH_JWT_SECRET)"
AUTH_REFRESH_PEPPER = "env(AUTH_REFRESH_PEPPER)"
AUTH_OTP_DEBUG = "env(AUTH_OTP_DEBUG)"
MYSOFT_MOCK = "env(MYSOFT_MOCK)"
MYSOFT_API_URL = "env(MYSOFT_API_URL)"
MYSOFT_USERNAME = "env(MYSOFT_USERNAME)"
MYSOFT_PASSWORD = "env(MYSOFT_PASSWORD)"
ANTHROPIC_API_KEY = "env(ANTHROPIC_API_KEY)"
FINLA_STREAM_TOOL_LOGS = "env(FINLA_STREAM_TOOL_LOGS)"

# Auth / refresh — Expo yanlış anon key ile gelse bile gateway'de patlamasın (yerel + hosted karışımı).
[functions.auth]
verify_jwt = false

[functions.mysoft-smoke]
verify_jwt = false

[functions.refresh]
verify_jwt = false

[analytics]
enabled = false
