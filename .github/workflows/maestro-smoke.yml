# DISABLED — Maestro CI paused until a macOS runner strategy is chosen
# (self-hosted service, GitHub-hosted macOS, or Maestro Cloud).
#
# To re-enable:
#   1. Restore `pull_request` under `on:` below
#   2. Remove `if: false` from the job
#   3. Set `runs-on` to your runner (self-hosted or macos-latest)
#
# Local smoke: npm run maestro:smoke (see .maestro/.env.example)

name: Maestro smoke

on:
  workflow_dispatch:

concurrency:
  group: maestro-smoke-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  maestro-smoke:
    name: maestro-smoke
    if: false
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90
    environment: develop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Write staging Expo env
        run: |
          cat > .env.local <<EOF
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_BASE_URL=${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          EOF

      - name: Install npm dependencies
        run: npm ci

      - name: Build iOS app and run Maestro smoke
        env:
          TEST_PHONE: ${{ secrets.TEST_PHONE }}
          TEST_PIN: ${{ secrets.TEST_PIN }}
          MAESTRO_SIMULATOR: ${{ vars.MAESTRO_SIMULATOR }}
        run: bash scripts/ci-maestro-ios.sh

      - name: Upload Maestro debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-${{ github.run_id }}
          path: ~/.maestro/tests/**/*
          if-no-files-found: ignore
