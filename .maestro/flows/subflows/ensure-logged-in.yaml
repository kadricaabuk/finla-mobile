# Skip onboarding, then log in with TEST_PHONE / TEST_PIN from Maestro env (-e flags).

appId: com.finla.app
---
- runFlow: skip-onboarding.yaml
- runFlow:
    when:
      notVisible:
        id: "chat-input"
    file: attempt-login.yaml
    env:
      TEST_PHONE: ${TEST_PHONE}
      TEST_PIN: ${TEST_PIN}
- assertVisible:
    id: "chat-input"
