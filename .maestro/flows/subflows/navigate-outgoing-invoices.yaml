# Navigate to outgoing invoices (Faturalarım) via the side menu.

appId: com.finla.app
---
- runFlow:
    when:
      notVisible:
        id: "side-menu-outgoing-invoices"
    commands:
      - tapOn:
          id: "header-menu"
- tapOn:
    id: "side-menu-outgoing-invoices"
- extendedWaitUntil:
    visible:
      id: "outgoing-invoices-title"
    timeout: 60000
- assertVisible:
    id: "invoice-filter-bu_ay"
- assertVisible: "Bu Ay"
