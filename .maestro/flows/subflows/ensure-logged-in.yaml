# Skip onboarding, then log in with MAESTRO_TEST_PHONE / MAESTRO_TEST_PIN.
# The Maestro CLI injects MAESTRO_* shell vars into flows; `npm run maestro*` sources them from the root .env.

appId: com.finla.app
---
- runFlow: skip-onboarding.yaml
- runFlow:
    when:
      notVisible:
        id: "chat-input"
    file: attempt-login.yaml
- assertVisible:
    id: "chat-input"
