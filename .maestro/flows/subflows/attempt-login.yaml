# Single login attempt. Env: MAESTRO_TEST_PHONE (5XXXXXXXXX), MAESTRO_TEST_PIN (6 digits) from the root .env.
# Staging user must exist with tenant linked and onboarding complete.

appId: com.finla.app
---
- tapOn:
    text: "OK"
    optional: true
    label: "Dismiss alert (EN)"
- tapOn:
    text: "Tamam"
    optional: true
    label: "Dismiss alert (TR)"
- tapOn:
    text: "Şimdi değil"
    optional: true
    label: "Decline biometric opt-in"
- tapOn:
    id: "login-phone"
- eraseText
- inputText: ${MAESTRO_TEST_PHONE}
- tapOn:
    id: "login-password-pin_login"
- eraseText
- inputText: ${MAESTRO_TEST_PIN}
- tapOn:
    id: "login-submit"
- tapOn:
    text: "Şimdi değil"
    optional: true
    label: "Decline biometric opt-in after login"
- runFlow:
    when:
      visible:
        id: "login-phone"
    commands:
      - extendedWaitUntil:
          visible: "Giriş Başarısız"
          timeout: 5000
          optional: true
      - extendedWaitUntil:
          visible: "Bağlantı Hatası"
          timeout: 2000
          optional: true
      - extendedWaitUntil:
          visible: "Hata"
          timeout: 2000
          optional: true
      - tapOn:
          text: "OK"
          optional: true
      - tapOn:
          text: "Tamam"
          optional: true
- assertVisible:
    id: "chat-input"
