# Login smoke test — phone + PIN (MAESTRO_TEST_PHONE / MAESTRO_TEST_PIN in the root .env).
#
# Run: npm run maestro:login

appId: com.finla.app
---
- launchApp:
    clearState: true
    clearKeychain: true
- assertVisible: "finla"
- runFlow: subflows/skip-onboarding.yaml
- assertVisible:
    id: "login-phone"
- runFlow: subflows/ensure-logged-in.yaml
- assertVisible:
    id: "chat-input"
