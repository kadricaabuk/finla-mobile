# Login smoke test — phone + PIN (TEST_PHONE / TEST_PIN in .maestro/.env or -e flags).
#
# Run: npm run maestro:login

appId: com.finla.app
---
- launchApp:
    clearState: true
    clearKeychain: true
- assertVisible: "finla"
- runFlow: subflows/skip-onboarding.yaml
- assertVisible:
    id: "login-phone"
- runFlow: subflows/ensure-logged-in.yaml
- assertVisible:
    id: "chat-input"
