# Outgoing invoices list test
#
# Run: npm run maestro:invoices

appId: com.finla.app
---
- launchApp:
    clearState: true
- assertVisible: "finla"
- runFlow: subflows/ensure-logged-in.yaml
- assertVisible:
    id: "chat-input"
- runFlow: subflows/open-menu.yaml
- runFlow: subflows/navigate-outgoing-invoices.yaml
